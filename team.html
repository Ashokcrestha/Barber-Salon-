    <script>
    document.addEventListener("DOMContentLoaded", function() {
        fetch('api_staff.php')
            .then(res => res.json())
            .then(data => {
                if (data.result === 'success' && data.staff && data.staff.length > 0) {
                    const container = document.getElementById('team-dynamic-container');
                    if (!container) return;
                    container.innerHTML = '';

                    data.staff.forEach((staff, index) => {
                        const isEven = index % 2 === 0;
                        const row = document.createElement('div');
                        row.className = 'row gx-5 align-items-center mb-5 pb-4';
                        if (index > 0) row.style.borderTop = '1px solid #2a2a2a';

                        const skillLine = staff.specialties ? staff.specialties : getSkillLine(staff.role);

                        const imgCol = `<div class="col-lg-5 ${isEven ? 'offset-lg-1' : 'order-lg-1 order-2 offset-lg-1'} text-center">
                            <div class="de-box-a">
                                <div class="d-image" style="border-radius:12px;overflow:hidden;">
                                    <img src="${staff.photo}" class="img-fluid" style="width:100%;max-height:380px;object-fit:cover;" alt="${staff.name}">
                                </div>
                                <div class="d-deco-1"></div>
                                <div class="d-deco-2"></div>
                            </div>
                            <div class="spacer-20"></div>
                        </div>`;

                        const infoCol = `<div class="col-lg-5 ${isEven ? '' : 'order-lg-2 order-1'}">
                            <h2 class="text-light">${staff.name}</h2>
                            <p class="id-color fw-bold fs-6 mb-1" style="margin-top:-10px;">${staff.role} &nbsp;&middot;&nbsp; ${staff.experience_years} Yrs Experience</p>
                            <p style="color:#aaa;font-size:13px;font-style:italic;margin-bottom:16px;line-height:1.7;">${skillLine}</p>
                            <p class="text-muted mb-4">${staff.bio}</p>
                            <a href="book.html?staff=${encodeURIComponent(staff.name)}" class="btn-main py-2 px-4 me-3 mb-3">
                                <i class="fa fa-calendar me-1"></i> Book Appointment
                            </a>
                            <div class="social-icons d-inline-block">
                                <a href="#"><i class="fa fa-facebook fa-lg"></i></a>
                                <a href="#"><i class="fa fa-instagram fa-lg"></i></a>
                            </div>
                        </div>`;

                        row.innerHTML = isEven ? (imgCol + infoCol) : (infoCol + imgCol);
                        container.appendChild(row);
                    });
                } else {
                    const container = document.getElementById('team-dynamic-container');
                    if (container) container.innerHTML = '<div class="col-12 text-center py-5"><p style="color:#666;">No team members found.</p></div>';
                }
            })
            .catch(err => {
                console.error('Team load error:', err);
                const container = document.getElementById('team-dynamic-container');
                if (container) container.innerHTML = '<div class="col-12 text-center py-5"><p style="color:#666;">Unable to load team members.</p></div>';
            });
    });

    function getSkillLine(role) {
        if (!role) return 'Skilled in precision grooming, styling, and delivering top-quality barbershop services.';
        const r = role.toLowerCase();
        if (r.includes('master') || r.includes('head'))
            return 'Expert in classic fades, modern cuts, beard sculpting, and luxury straight-razor shaves.';
        if (r.includes('senior'))
            return 'Specialises in textured cuts, skin fades, beard styling, and personalised grooming plans.';
        if (r.includes('junior') || r.includes('apprentice'))
            return 'Skilled in clean trims, basic fades, and delivering friendly, attentive grooming service.';
        if (r.includes('beard') || r.includes('shave'))
            return 'Precision beard sculpting, hot towel shaves, line-ups, and skin care treatments.';
        if (r.includes('stylist'))
            return 'Creative hair styling, colour treatments, blow-dry finishing, and trend-forward looks.';
        return 'Dedicated to precision cuts, smooth shaves, and outstanding personalised grooming service.';
    }
    </script>
